name: Daily media narrative update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas

      - name: Fetch daily media coverage
        run: |
          python scripts/fetch_daily_news.py

      - name: Commit updated article data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update daily media narrative data"
          file_pattern: data/articles.json
